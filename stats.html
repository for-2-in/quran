<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات التلاوات القرآنية</title>
    <!-- خطوط جوجل والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CVHY0SWNL3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CVHY0SWNL3');
    </script>

    <style>
        :root {
            --bg-primary: #0a1118;
            --bg-card: #131e29;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            padding: 1.5rem;
        }

        .stats-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            border: 1px solid var(--border-color);
        }

        .stats-title {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--gold-primary);
            margin-bottom: 0.5rem;
        }

        .stats-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            color: var(--bg-primary);
            background-color: var(--gold-primary);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.25s ease;
        }

        .btn-back:hover {
            background-color: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>

    <div class="stats-card">
        <div class="icon-box">
            <i class="fa-solid fa-chart-line"></i>
        </div>
        <h1 class="stats-title">إحصائيات الزوار</h1>
        <p class="stats-subtitle">يتم متابعة وتسجيل زيارات هذا الموقع عبر Google Analytics لتحسين وتطوير الأداء.</p>
        
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-right"></i>
            <span>العودة للصفحة الرئيسية</span>
        </a>
    </div>

</body>
</html>
